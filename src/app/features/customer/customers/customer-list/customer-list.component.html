<div class="p-6 bg-gray-50 min-h-screen">
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="flex justify-between items-center p-6 border-b border-gray-100 bg-white">
            <div>
                <h2 class="text-2xl font-semibold text-gray-800 tracking-tight">Customers</h2>
                <p class="text-sm text-gray-500 mt-1">Manage your customer base and information</p>
            </div>
            <button pButton label="New Customer" icon="pi pi-plus" class="p-button-outlined p-button-secondary"
                (click)="openNew()"></button>
        </div>

        <p-table [value]="(customers$ | async)!" [loading]="(loading$ | async)!" [rows]="10" [paginator]="true"
            responsiveLayout="scroll" styleClass="p-datatable-sm" [tableStyle]="{'min-width': '50rem'}">
            <ng-template pTemplate="header">
                <tr class="bg-gray-50/50">
                    <th class="p-4 text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                    <th class="p-4 text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                    <th class="p-4 text-xs font-medium text-gray-500 uppercase tracking-wider">Phone</th>
                    <th class="p-4 text-xs font-medium text-gray-500 uppercase tracking-wider">City</th>
                    <th class="p-4 text-xs font-medium text-gray-500 uppercase tracking-wider text-right">Actions</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-customer>
                <tr class="hover:bg-gray-50 transition-colors duration-150 border-b border-gray-50 last:border-0">
                    <td class="p-4">
                        <div class="font-medium text-gray-900">{{customer.firstName}} {{customer.lastName}}</div>
                    </td>
                    <td class="p-4 text-gray-600">{{customer.email}}</td>
                    <td class="p-4 text-gray-600">{{customer.phone}}</td>
                    <td class="p-4 text-gray-600">
                        <span
                            class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-50 text-blue-700">
                            {{customer.adresse?.city || 'N/A'}}
                        </span>
                    </td>
                    <td class="p-4 text-right">
                        <div class="flex justify-end gap-2">
                            <button pButton icon="pi pi-pencil"
                                class="p-button-rounded p-button-text p-button-secondary p-button-sm hover:bg-gray-100 transition-colors"
                                (click)="editCustomer(customer)"></button>
                            <button pButton icon="pi pi-trash"
                                class="p-button-rounded p-button-text p-button-danger p-button-sm hover:bg-red-50 transition-colors"
                                (click)="deleteCustomer(customer)"></button>
                        </div>
                    </td>
                </tr>
            </ng-template>
            <ng-template pTemplate="emptymessage">
                <tr>
                    <td colspan="5" class="text-center p-8">
                        <div class="flex flex-col items-center justify-center text-gray-400">
                            <i class="pi pi-users text-4xl mb-3 opacity-20"></i>
                            <span class="text-sm">No customers found.</span>
                        </div>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>

<p-dialog [(visible)]="customerDialog" [style]="{width: '450px'}" header="Customer Details" [modal]="true"
    styleClass="p-fluid">
    <ng-template pTemplate="content">
        <app-customer-form [customer]="selectedCustomer" (save)="onSave($event)"
            (cancel)="hideDialog()"></app-customer-form>
    </ng-template>
</p-dialog>
