<div class="p-6 bg-gray-50 min-h-screen">
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="flex justify-between items-center p-6 border-b border-gray-100 bg-white">
            <div>
                <h2 class="text-2xl font-semibold text-gray-800 tracking-tight">Vehicles</h2>
                <p class="text-sm text-gray-500 mt-1">Manage fleet vehicles and availability</p>
            </div>
            <button pButton label="New Vehicle" icon="pi pi-plus" class="p-button-outlined p-button-secondary"
                (click)="openNew()"></button>
        </div>

        <p-table [value]="(vehicles$ | async)!" [loading]="(loading$ | async)!" [rows]="10" [paginator]="true"
            responsiveLayout="scroll" styleClass="p-datatable-sm" [tableStyle]="{'min-width': '50rem'}">
            <ng-template pTemplate="header">
                <tr class="bg-gray-50/50">
                    <th class="p-4 text-xs font-medium text-gray-500 uppercase tracking-wider">Plate Number</th>
                    <th class="p-4 text-xs font-medium text-gray-500 uppercase tracking-wider">Brand</th>
                    <th class="p-4 text-xs font-medium text-gray-500 uppercase tracking-wider">Model</th>
                    <th class="p-4 text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                    <th class="p-4 text-xs font-medium text-gray-500 uppercase tracking-wider">Capacity</th>
                    <th class="p-4 text-xs font-medium text-gray-500 uppercase tracking-wider text-right">Actions</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-vehicle>
                <tr class="hover:bg-gray-50 transition-colors duration-150 border-b border-gray-50 last:border-0">
                    <td class="p-4 font-mono text-xs text-gray-900">{{vehicle.plateNumber}}</td>
                    <td class="p-4 text-gray-600">{{vehicle.brand}}</td>
                    <td class="p-4 text-gray-600">{{vehicle.model}}</td>
                    <td class="p-4">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium" [ngClass]="{
                                'bg-green-100 text-green-800': vehicle.status === 'AVAILABLE',
                                'bg-blue-100 text-blue-800': vehicle.status === 'IN_USE',
                                'bg-gray-100 text-gray-800': vehicle.status === 'MAINTENANCE'
                            }">
                            {{vehicle.status}}
                        </span>
                    </td>
                    <td class="p-4 text-gray-600">{{vehicle.capacity}}</td>
                    <td class="p-4 text-right">
                        <div class="flex justify-end gap-2">
                            <button pButton icon="pi pi-pencil"
                                class="p-button-rounded p-button-text p-button-secondary p-button-sm hover:bg-gray-100"
                                (click)="editVehicle(vehicle)"></button>
                        </div>
                    </td>
                </tr>
            </ng-template>
            <ng-template pTemplate="emptymessage">
                <tr>
                    <td colspan="6" class="text-center p-8">
                        <div class="flex flex-col items-center justify-center text-gray-400">
                            <i class="pi pi-car text-4xl mb-3 opacity-20"></i>
                            <span class="text-sm">No vehicles found.</span>
                        </div>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>

<p-dialog [(visible)]="vehicleDialog" [style]="{width: '450px'}" header="Vehicle Details" [modal]="true"
    styleClass="p-fluid">
    <ng-template pTemplate="content">
        <app-vehicle-form [vehicle]="selectedVehicle" (save)="onSave($event)"
            (cancel)="hideDialog()"></app-vehicle-form>
    </ng-template>
</p-dialog>
