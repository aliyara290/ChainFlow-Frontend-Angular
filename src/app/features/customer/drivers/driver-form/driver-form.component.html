<div class="p-1">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
        <div class="space-y-1">
            <label for="firstName" class="block text-sm font-medium text-gray-700">First Name</label>
            <input type="text" pInputText id="firstName" [(ngModel)]="model.firstName" required autofocus
                class="w-full" />
        </div>
        <div class="space-y-1">
            <label for="lastName" class="block text-sm font-medium text-gray-700">Last Name</label>
            <input type="text" pInputText id="lastName" [(ngModel)]="model.lastName" required class="w-full" />
        </div>
        <div class="space-y-1">
            <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
            <input type="email" pInputText id="email" [(ngModel)]="model.email" required class="w-full" />
        </div>
        <div class="space-y-1">
            <label for="phone" class="block text-sm font-medium text-gray-700">Phone</label>
            <input type="text" pInputText id="phone" [(ngModel)]="model.phone" required class="w-full" />
        </div>
    </div>

    <div class="border-t border-gray-100 pt-6 mt-6">
        <h3 class="text-sm font-semibold text-gray-900 mb-4 uppercase tracking-wider">License Details</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="space-y-1">
                <label for="licenseType" class="block text-sm font-medium text-gray-700">License Type</label>
                <input type="text" pInputText id="licenseType" [(ngModel)]="model.licenseType" required
                    class="w-full" />
            </div>
            <div class="space-y-1">
                <label for="licenseNumber" class="block text-sm font-medium text-gray-700">License Number</label>
                <input type="text" pInputText id="licenseNumber" [(ngModel)]="model.licenseNumber" required
                    class="w-full" />
            </div>
        </div>
    </div>

    <div class="flex justify-end gap-3 mt-8 pt-4 border-t border-gray-100">
        <button pButton label="Cancel" icon="pi pi-times" class="p-button-text p-button-secondary"
            (click)="onCancel()"></button>
        <button pButton label="Save Changes" icon="pi pi-check"
            class="p-button-primary bg-green-600 border-green-600 hover:bg-green-700" (click)="onSave()"></button>
    </div>
</div>
