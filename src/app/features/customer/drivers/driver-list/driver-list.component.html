<div class="p-6 bg-gray-50 min-h-screen">
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="flex justify-between items-center p-6 border-b border-gray-100 bg-white">
            <div>
                <h2 class="text-2xl font-semibold text-gray-800 tracking-tight">Drivers</h2>
                <p class="text-sm text-gray-500 mt-1">Manage driver profiles and licenses</p>
            </div>
            <button pButton label="New Driver" icon="pi pi-plus" class="p-button-outlined p-button-secondary"
                (click)="openNew()"></button>
        </div>

        <p-table [value]="(drivers$ | async)!" [loading]="(loading$ | async)!" [rows]="10" [paginator]="true"
            responsiveLayout="scroll" styleClass="p-datatable-sm" [tableStyle]="{'min-width': '50rem'}">
            <ng-template pTemplate="header">
                <tr class="bg-gray-50/50">
                    <th class="p-4 text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                    <th class="p-4 text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                    <th class="p-4 text-xs font-medium text-gray-500 uppercase tracking-wider">Phone</th>
                    <th class="p-4 text-xs font-medium text-gray-500 uppercase tracking-wider">License Type</th>
                    <th class="p-4 text-xs font-medium text-gray-500 uppercase tracking-wider">License Number</th>
                    <th class="p-4 text-xs font-medium text-gray-500 uppercase tracking-wider text-right">Actions</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-driver>
                <tr class="hover:bg-gray-50 transition-colors duration-150 border-b border-gray-50 last:border-0">
                    <td class="p-4">
                        <div class="font-medium text-gray-900">{{driver.firstName}} {{driver.lastName}}</div>
                    </td>
                    <td class="p-4 text-gray-600">{{driver.email}}</td>
                    <td class="p-4 text-gray-600">{{driver.phone}}</td>
                    <td class="p-4">
                        <span
                            class="inline-flex items-center px-2.5 py-0.5 rounded-md text-xs font-medium bg-gray-100 text-gray-800 border border-gray-200">
                            {{driver.licenseType}}
                        </span>
                    </td>
                    <td class="p-4 font-mono text-xs text-gray-600">{{driver.licenseNumber}}</td>
                    <td class="p-4 text-right">
                        <div class="flex justify-end gap-2">
                            <button pButton icon="pi pi-pencil"
                                class="p-button-rounded p-button-text p-button-secondary p-button-sm hover:bg-gray-100"
                                (click)="editDriver(driver)"></button>
                        </div>
                    </td>
                </tr>
            </ng-template>
            <ng-template pTemplate="emptymessage">
                <tr>
                    <td colspan="6" class="text-center p-8">
                        <div class="flex flex-col items-center justify-center text-gray-400">
                            <i class="pi pi-id-card text-4xl mb-3 opacity-20"></i>
                            <span class="text-sm">No drivers found.</span>
                        </div>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>

<p-dialog [(visible)]="driverDialog" [style]="{width: '450px'}" header="Driver Details" [modal]="true"
    styleClass="p-fluid">
    <ng-template pTemplate="content">
        <app-driver-form [driver]="selectedDriver" (save)="onSave($event)" (cancel)="hideDialog()"></app-driver-form>
    </ng-template>
</p-dialog>
